<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#23140c">
  <title>Antojitos y Algo Más — Carta Digital</title>
  <meta name="description" content="Carta digital oficial de Antojitos y Algo Más — Un lugar para tardear en La Habana, Guadalajara de Buga.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="hero">
    <svg class="hero__steam" viewBox="0 0 120 90" fill="none" aria-hidden="true">
        <path class="steam-line steam-line--1" d="M34 84 C26 64, 42 48, 32 28 C26 16, 34 8, 38 4" />
        <path class="steam-line steam-line--2" d="M62 86 C72 64, 52 46, 64 24 C70 14, 62 6, 58 2" />
        <path class="steam-line steam-line--3" d="M88 82 C80 64, 94 48, 86 30 C82 20, 88 12, 92 6" />
    </svg>

    <div class="hero__top">
      <div class="brand">
        <img
          id="brandLogo"
          class="brand__logo"
          src="assets/img/logo.webp"
          alt="Logo Antojitos y Algo Más"
          hidden
        >
        <div class="brand__text">
          <span class="brand__eyebrow">La Habana · Buga</span>
          <h1 class="brand__title" id="brandName">Antojitos y Algo Más</h1>
          <p class="brand__tagline" id="brandTagline">Un lugar para tardear</p>
        </div>
      </div>

      <button
        id="themeToggle"
        class="icon-btn"
        type="button"
        aria-label="Cambiar entre modo claro y oscuro"
        title="Cambiar tema"
      >
        <span class="icon-btn__glyph" id="themeIcon" aria-hidden="true">☀</span>
      </button>
    </div>

    <div class="search-wrap">
      <input
        id="searchInput"
        class="search-input"
        type="search"
        placeholder="Buscar plato, bebida o ingrediente..."
        autocomplete="off"
        aria-label="Buscar en la carta"
      >
    </div>
  </header>

  <nav class="cat-bar" aria-label="Categorías del menú">
    <div class="cat-strip" id="categoryStrip" role="tablist"></div>
  </nav>

  <main class="menu-main" id="menuContainer" aria-live="polite">
    <div class="skeleton-list" id="loadingState">
      <div class="skeleton-row"></div>
      <div class="skeleton-row"></div>
      <div class="skeleton-row"></div>
      <div class="skeleton-row"></div>
      <div class="skeleton-row"></div>
    </div>
  </main>

  <footer class="site-footer">
    <section class="nequi-card" aria-label="Pago por Nequi">
      <div>
        <span class="nequi-card__label">Pagos por Nequi</span>
        <strong class="nequi-card__number" id="nequiNumber">316 494 2475</strong>
        <span class="nequi-card__holder" id="nequiHolder">Marisel García</span>
      </div>
      <button id="copyNequiBtn" class="btn-accent" type="button">Copiar</button>
    </section>

    <div class="social-row">
      <a id="whatsappLink" class="social-pill" target="_blank" rel="noopener noreferrer">WhatsApp</a>
      <a id="instagramLink" class="social-pill" target="_blank" rel="noopener noreferrer">Instagram</a>
    </div>

    <p class="footer-note">Toca cualquier producto para ver ingredientes, opciones y fotografía.</p>
  </footer>

  <!-- Bottom sheet nativo de detalle -->
  <dialog id="detailDialog" class="sheet" aria-labelledby="sheetTitle">
    <div class="sheet__handle" aria-hidden="true"></div>
    <button id="closeSheetBtn" class="sheet__close" type="button" aria-label="Cerrar detalle">✕</button>

    <figure id="sheetMedia" class="sheet__media" hidden>
      <img id="sheetImg" src="" alt="" loading="lazy">
    </figure>

    <div class="sheet__body">
      <div class="sheet__meta">
        <span id="sheetCategory" class="badge-cat"></span>
        <span id="sheetStatus" class="badge-status" hidden>Agotado hoy</span>
      </div>

      <div class="sheet__header">
        <h2 id="sheetTitle" class="sheet__title"></h2>
        <span id="sheetPrice" class="sheet__price"></span>
      </div>

      <p id="sheetDesc" class="sheet__desc" hidden></p>

      <div id="sheetOptionsWrap" class="sheet__options" hidden>
        <span class="sheet__options-label">Opciones disponibles</span>
        <div id="sheetOptions" class="chip-group"></div>
      </div>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
